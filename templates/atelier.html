<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anémomètre — Marseille Mistral Tracker</title>


  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .dashboard-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 450px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-color: transparent;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

   
    #chart_div {
      width: 250px;
      height: 250px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }

    #status {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #64748b;
    }

    .refresh-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 20px;
      transition: background 0.2s ease;
    }
    .refresh-btn:hover { background: #2563eb; }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <h1>Anémomètre en Temps Réel</h1>
    <p class="subtitle">Vitesse actuelle du vent — Marseille (10m du sol)</p>
    
  
    <div id="chart_div"></div>
    
    <button class="refresh-btn" onclick="updateData()">Actualiser</button>
    <div id="status">Initialisation...</div>
  </div>

  <script>
  
    google.charts.load('current', {'packages':['gauge']});
    google.charts.setOnLoadCallback(initChart);

    let chart;
    let dataTable;
    let chartOptions;

    function initChart() {
    
      dataTable = google.visualization.arrayToDataTable([
        ['Label', 'Value'],
        ['Vent km/h', 0]
      ]);

  
      chartOptions = {
        width: 250, 
        height: 250,
        max: 120,          
        yellowFrom: 45,   
        yellowTo: 75,
        redFrom: 75,      
        redTo: 120,
        minorTicks: 5      
      };

      chart = new google.visualization.Gauge(document.getElementById('chart_div'));
      chart.draw(dataTable, chartOptions);
      
      
      updateData();
    }

    async function updateData() {
      document.getElementById('status').textContent = "Synchronisation Open-Meteo...";
      try {
        const res = await fetch('/api/vent-marseille');
        const json = await res.json();

        if (json.status === "success") {
        
          dataTable.setValue(0, 1, json.vitesse);
          
          
          chart.draw(dataTable, chartOptions);
          
          document.getElementById('status').textContent = `Mis à jour à ${new Date().toLocaleTimeString()}`;
        } else {
          throw new Error(json.message);
        }
      } catch (err) {
        document.getElementById('status').textContent = "Erreur de chargement API";
        console.error(err);
      }
    }
  </script>
</body>
</html>
